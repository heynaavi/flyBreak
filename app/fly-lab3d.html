<!doctype html>
<html><head><meta charset="utf-8"><title>fly lab 3d</title><style>body{margin:0;background:#5f7391}canvas{display:block}</style><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<canvas id="gl" width="1000" height="500" style="width:1000px;height:500px"></canvas>
<script type="module">
  const { createFly3D } = await import('./renderer/fly3d.js?v=' + Date.now());
  const q = new URLSearchParams(location.search);
  const fly3d = await createFly3D({ canvas: document.getElementById('gl'), W: 1000, H: 500, bodyLength: +(q.get('len') || 260) });
  const flying = { x: 300, y: 250, heading: -0.3, roll: 0.2, alt: 0.5, flying: true, wingPhase: 0, proboscis: 0, scale: 2.6 };
  const resting = { x: 500, y: 250, heading: 0.2, roll: 0, alt: 0, flying: false, wingPhase: 0, proboscis: 0.8, scale: 2.6 };
  window.FLY = fly3d;
  const cubes = [{ x: 500, y: 300, amount: 1 }, { x: 580, y: 300, amount: 1 }]; const perched = { x: 500, y: 328, z: 61, heading: Math.PI / 2, roll: 0, alt: 0, flying: false, wingPhase: 0, proboscis: 0.8, scale: 2.6 };
  function frame(t) {
    flying.wingPhase = t / 60;
    if (q.get('perch')) { fly3d.setCubes(cubes, 64); fly3d.render(perched); } else if (q.get('one')) { flying.x = 500; fly3d.render(flying); } else { fly3d.render(q.get('rest') ? resting : flying); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script></body></html>
